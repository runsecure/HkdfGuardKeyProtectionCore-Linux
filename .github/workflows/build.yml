# Builds and tests HKDFGuard for linux/x86_64 and linux/aarch64, each on a
# *native* runner (no QEMU), inside the same docker/Dockerfile image that
# docker/run-tests.sh and docker/build-dist.sh use locally -- so CI builds
# exactly what a developer builds: Ubuntu 24.04, glibc 2.39, tpm2-tss 4.0.1.
# The binaries therefore need glibc >= 2.39 (Ubuntu 24.04+, Debian 13,
# RHEL 10) and libtss2-esys at runtime.
#
# Per architecture:
#   1. docker/entrypoint-test.sh  -- the full matrix, including the TPM
#      conformance suite against swtpm and PKCS#11 against SoftHSM2. A
#      binary is never published for an architecture where this fails.
#   2. docker/entrypoint-build.sh -- release build (--all-features) and
#      artifact collection.
#   3. Package as hkdfguard-<version>-linux-<arch>.tar.gz with a SHA-256,
#      and a Sigstore build-provenance attestation (verify with
#      `gh attestation verify <file> --repo <owner>/<repo>`).
#
# A separate, independent job runs `cargo deny check advisories bans
# sources` against Cargo.lock (see deny.toml) as a supply-chain gate.
#
# On a `v*` tag, a release job attaches both archives (and their checksums)
# to a GitHub Release.
#
# Every action below is pinned to a commit SHA, not a floating tag, so a
# compromised or re-tagged action can't silently change what this workflow
# runs; the trailing comment names the release that SHA corresponds to.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  supply-chain:
    name: cargo deny (advisories, bans, sources)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          command-arguments: advisories bans sources

  build:
    name: build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write      # for attest-build-provenance's Sigstore signing
      attestations: write  # to publish the attestation to this repo

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # The image (apt packages + rustup) is the slow part and rarely
      # changes; cache its layers per architecture.
      - name: Build the build/test image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          tags: hkdfguard-ci:${{ matrix.arch }}
          load: true
          cache-from: type=gha,scope=hkdfguard-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=hkdfguard-${{ matrix.arch }}

      - name: Full test matrix (swtpm + SoftHSM2)
        run: docker run --rm --cap-add IPC_LOCK hkdfguard-ci:${{ matrix.arch }}   # IPC_LOCK: exercises the CLI's mlockall path

      - name: Release build
        run: |
          mkdir -p dist
          docker run --rm \
            -v "$PWD/dist:/dist" \
            --entrypoint docker/entrypoint-build.sh \
            hkdfguard-ci:${{ matrix.arch }}

      - name: Verify architecture of the produced binaries
        run: |
          sudo chown -R "$(id -u):$(id -g)" dist
          case "${{ matrix.arch }}" in
            x86_64)  want='x86-64' ;;
            aarch64) want='ARM aarch64' ;;
          esac
          for f in dist/libHkdfGuardKeyProtectionLinux.so dist/hkdfguard-v1-initialize; do
            file "$f"
            file "$f" | grep -q "$want" || { echo "::error::$f is not $want"; exit 1; }
          done

      - name: Package
        id: package
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME}"
          else
            version="$(git rev-parse --short HEAD)"
          fi
          name="hkdfguard-${version}-linux-${{ matrix.arch }}"
          mkdir -p "pkg/$name/lib" "pkg/$name/bin" "pkg/$name/include"
          cp dist/libHkdfGuardKeyProtectionLinux.so dist/libHkdfGuardKeyProtectionLinux.a "pkg/$name/lib/"
          # The project's release artifact name (see scripts/build-release.sh).
          cp dist/libHkdfGuardKeyProtectionLinux.so "pkg/$name/lib/HkdfGuard.Kms.Linux.v1.so"
          cp dist/hkdfguard-v1-initialize "pkg/$name/bin/"
          cp dist/hkdfguard.h "pkg/$name/include/"
          cp README.md "pkg/$name/"
          tar -C pkg -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          cat "$name.tar.gz.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      # Signed, verifiable provenance for the exact bytes being published:
      # which workflow run, which commit, which runner produced this file.
      # The SHA-256 above is integrity ("these bytes are unmodified"); this
      # is authenticity ("these bytes came from this repo's CI"). Verify
      # with: gh attestation verify <file>.tar.gz --repo <owner>/<repo>
      #
      # Not on pull requests: a PR build is never published, and a PR from
      # a fork gets no id-token, so the step could only fail there.
      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: ${{ steps.package.outputs.name }}.tar.gz

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            ${{ steps.package.outputs.name }}.tar.gz
            ${{ steps.package.outputs.name }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, supply-chain]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.tar.gz.sha256
          generate_release_notes: true
